<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgroRisk | Perfil</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div class="profile-page">

        <div class="topbar">
            <div>
                <h2>Meu Perfil</h2>
                <span>Gerencie suas informações pessoais</span>
            </div>

            <div class="perfil-topo">
                <img src="img/profile.png" id="previewFotoTopo" alt="Perfil">
                <div>
                    <strong>João Silva</strong>
                    <small>Administrador</small>
                </div>
            </div>
        </div>

        <div class="profile-content">

            <!-- COLUNA ESQUERDA -->
            <div class="profile-left">

                <div class="profile-card">

                    <div class="profile-photo-area">

                        <img src="img/profile.png" class="profile-photo" id="previewFoto">

                        <input type="file" id="fotoPerfil" hidden>

                        <button class="btn-profile-photo" onclick="document.getElementById('fotoPerfil').click()">

                            <i class="fa-solid fa-camera"></i>

                            Alterar Foto

                        </button>

                    </div>

                </div>

                <div class="profile-card">

                    <h3>Informações da Conta</h3>

                    <div class="profile-info">

                        <div class="info-item">

                            <span>Tipo de Conta</span>

                            <strong>Administrador</strong>

                        </div>

                        <div class="info-item">

                            <span>Data de Cadastro</span>

                            <strong>12/03/2026</strong>

                        </div>

                        <div class="info-item">

                            <span>Último Acesso</span>

                            <strong>Hoje às 08:15</strong>

                        </div>

                        <div class="info-item">

                            <span>Status</span>

                            <strong class="status-active">
                                Ativa
                            </strong>

                        </div>

                    </div>

                </div>

            </div>

            <!-- COLUNA DIREITA -->
            <div class="profile-right">

                <div class="profile-card">

                    <h3>Informações Pessoais</h3>

                    <div class="profile-grid">

                        <div class="form-group">
                            <label>Nome Completo</label>

                            <input type="text" id="nome" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>E-mail</label>

                            <input type="email" id="email" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Telefone</label>
                            <input type="text" id="telefonefield" class="form-control" placeholder="(00) 00000-0000">
                        </div>

                        <div class="form-group">
                            <label>CPF</label>
                            <input type="text" id="cpffield" class="form-control" placeholder="000.000.000-00">
                        </div>

                        <div class="form-group">
                            <label>Data de Nascimento</label>
                            <input type="date" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Estado</label>

                            <select class="form-control">

                                <option>Minas Gerais</option>
                                <option>São Paulo</option>
                                <option>Rio de Janeiro</option>

                            </select>

                        </div>

                        <div class="form-group">
                            <label>Cidade</label>
                            <input type="text" class="form-control">
                        </div>

                        <div class="form-group">
                            <label>Idioma</label>

                            <select class="form-control">

                                <option>Português</option>
                                <option>English</option>

                            </select>

                        </div>

                    </div>

                </div>

                <div class="profile-card">

                    <h3>Segurança</h3>

                    <div class="profile-grid">

                        <div class="form-group">

                            <label>Senha Atual</label>

                            <input type="password" class="form-control">

                        </div>

                        <div class="form-group">

                            <label>Nova Senha</label>

                            <input type="password" class="form-control">

                        </div>

                        <div class="form-group">

                            <label>Confirmar Nova Senha</label>

                            <input type="password" class="form-control">

                        </div>

                    </div>

                </div>

                <div class="profile-card">

                    <h3>Preferências</h3>

                    <div class="profile-options">

                        <label>

                            <input type="checkbox" checked>

                            Receber notificações por e-mail

                        </label>

                        <label>

                            <input type="checkbox" checked>

                            Receber notificações no sistema

                        </label>

                        <label>

                            <input type="checkbox">

                            Receber novidades do AgroRisk

                        </label>

                    </div>

                </div>

                <div class="profile-actions">

                    <button class="btn-profile-cancel">

                        Cancelar

                    </button>

                    <button class="btn-profile-save">

                        <i class="fa-solid fa-floppy-disk"></i>

                        Salvar Alterações

                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/perfil.js"></script>
</body>

</html>
